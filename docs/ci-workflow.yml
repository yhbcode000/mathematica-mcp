# CI workflow source (ready to activate)
#
# GitHub refuses to create or update files under .github/workflows/ unless the
# credential has the workflow OAuth scope (or a PAT/App token with Workflows
# write permission). This repository's publication token had repo+gist+read:org
# only, so the file is parked here and can be activated by a credential with that
# scope:
#
#   gh auth refresh -h github.com -s workflow      # one-time, opens a browser
#   Copy-Item docs/ci-workflow.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml
#   git commit -m "Add CI workflow"
#   git push
#
# The workflow itself is validated by this repository's own checks and by running
# its steps locally: node --test, node dsh/scripts/sync-server.mjs --check,
# node notebook/scripts/sync-kernel.mjs --check, node market/validate-index.mjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The server has no runtime dependencies, so there is nothing to install.
      # Tests that need a Mathematica kernel skip themselves when no kernel is
      # available (this CI has none); see test/ for the detection logic.
      # The same `node --test` discovery also runs the DSH notebook plugin's tests
      # under notebook/test/, so both suites must stay portable across the Node
      # 18/20/22 matrix (the Host plugin itself runs on the DSH runtime).
      # Note: `node --test` (auto-discovery) is used instead of `node --test test/`
      # because Node 24 treats a positional directory as a single test entry.
      - name: Run tests (server + notebook)
        run: node --test
        env:
          CI: 'true'
          # Belt-and-braces: the suite also auto-skips kernel tests when no kernel is
          # found, but CI must never depend on that detection.
          MATHEMATICA_MCP_TEST_SKIP_KERNEL: '1'

      - name: Smoke-test the MCP handshake
        shell: bash
        run: |
          node - <<'EOF'
          const { spawn } = require('node:child_process')
          const child = spawn(process.execPath, ['bin/mathematica-mcp.js'], { stdio: ['pipe', 'pipe', 'inherit'] })
          let buffered = ''
          const send = (message) => child.stdin.write(JSON.stringify(message) + '\n')
          const timeout = setTimeout(() => { console.error('timed out waiting for initialize response'); child.kill(); process.exit(1) }, 20000)
          child.stdout.on('data', (chunk) => {
            buffered += chunk
            for (const line of buffered.split('\n').slice(0, -1)) {
              if (!line.trim()) continue
              const message = JSON.parse(line)
              if (message.id === 1) {
                if (!message.result || !message.result.serverInfo) { console.error('bad initialize result'); child.kill(); process.exit(1) }
                send({ jsonrpc: '2.0', method: 'notifications/initialized' })
                send({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} })
              }
              if (message.id === 2) {
                const names = (message.result?.tools ?? []).map((tool) => tool.name)
                const expected = ['mathematica_evaluate', 'mathematica_export', 'mathematica_kernel_status', 'mathematica_information']
                const missing = expected.filter((name) => !names.includes(name))
                if (missing.length) { console.error('missing tools: ' + missing.join(', ') + ' (got: ' + names.join(', ') + ')'); child.kill(); process.exit(1) }
                clearTimeout(timeout)
                console.log('initialize + tools/list OK: ' + names.join(', '))
                child.kill()
                process.exit(0)
              }
            }
            buffered = buffered.slice(buffered.lastIndexOf('\n') + 1)
          })
          child.on('exit', (code) => { if (code !== 0 && code !== null) { console.error('server exited ' + code); process.exit(1) } })
          send({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'ci', version: '0.0.0' } } })
          EOF

  package-validate:
    name: Validate package layout, bundle and market index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate JSON files and bundle manifest
        run: |
          node - <<'EOF'
          const { readFileSync, existsSync, statSync } = require('node:fs')
          const failures = []
          const check = (ok, message) => { if (!ok) failures.push(message) }
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))

          const root = readJson('package.json')
          check(root.name === 'mathematica-mcp', 'root package.json name must be mathematica-mcp')
          check(root.type === 'module', 'root package.json must be ESM (type: module)')
          check((root.bin ?? {})['mathematica-mcp'] === './bin/mathematica-mcp.js', 'root package.json bin entry missing')
          check(Object.keys(root.dependencies ?? {}).length === 0, 'root package must have zero runtime dependencies')

          const bundle = readJson('dsh/package.json')
          check(bundle.name === 'dsh-mathematica-mcp', 'bundle name must be dsh-mathematica-mcp')
          check(typeof bundle.dsh?.bundle?.patch === 'string', 'bundle must declare dsh.bundle.patch')
          const patch = bundle.dsh?.bundle?.patch ?? ''
          check(existsSync('dsh/' + patch), `bundle patch file ${patch} is missing`)
          check(Array.isArray(bundle.files) && bundle.files.includes('server/**'), 'bundle files must include server/**')
          check(bundle.files.includes('cordis.patch.yml'), 'bundle files must include cordis.patch.yml')
          check(bundle.files.includes('locale/*.json'), 'bundle files must include locale/*.json')
          check(bundle.files.includes('icon.svg'), 'bundle files must include icon.svg')
          check(bundle.exports?.['./icon'] === './icon.svg', 'bundle must export ./icon')
          check(bundle.exports?.['./locale/*.json'] === './locale/*.json', 'bundle must export ./locale/*.json')

          for (const locale of ['en', 'zh']) {
            const text = readJson(`dsh/locale/${locale}.json`)
            check(typeof text.meta?.title === 'string' && text.meta.title.length > 0, `dsh/locale/${locale}.json meta.title missing`)
            check(typeof text.meta?.description === 'string' && text.meta.description.length > 0, `dsh/locale/${locale}.json meta.description missing`)
          }

          check(existsSync('dsh/server/bin/mathematica-mcp.js'), 'dsh/server/bin/mathematica-mcp.js is missing (run node dsh/scripts/sync-server.mjs)')
          check(existsSync('dsh/server/src/server.js'), 'dsh/server/src/server.js is missing (run node dsh/scripts/sync-server.mjs)')
          check(existsSync('dsh/server/package.json'), 'dsh/server/package.json is missing (the server reads ../package.json for its version metadata)')

          const iconSize = existsSync('dsh/icon.svg') ? statSync('dsh/icon.svg').size : 0
          check(iconSize > 100 && iconSize <= 256 * 1024, 'dsh/icon.svg must exist and be at most 256 KiB')
          check(readFileSync('dsh/icon.svg', 'utf8').includes('<svg'), 'dsh/icon.svg must be SVG')

          check(existsSync('market/index.json'), 'market/index.json is missing')
          check(existsSync('LICENSE'), 'LICENSE is missing')

          if (failures.length) { for (const failure of failures) console.error('FAIL: ' + failure); process.exit(1) }
          console.log('package layout, bundle manifest and display resources OK')
          EOF

      - name: Validate market index (format 1)
        run: node market/validate-index.mjs market/index.json

      - name: Verify dsh/server is in sync with bin/ + src/
        run: node dsh/scripts/sync-server.mjs --check

      - name: Validate bundle patch structure and guardrails
        run: |
          node - <<'EOF'
          const { readFileSync } = require('node:fs')
          const text = readFileSync('dsh/cordis.patch.yml', 'utf8')
          const failures = []
          const check = (ok, message) => { if (!ok) failures.push(message) }
          // The patch uses the DSH Loader's custom !!js tag, which generic YAML parsers do
          // not understand. These text assertions pin the structure and the launch guardrails;
          // the authoritative parse check is `dsh --profile <profile> --dump-config` (see
          // docs/publish-status.md) against a real DSH installation.
          check(/^- insert:/m.test(text), 'patch must contain a top-level insert list')
          check(text.includes('@deepseek-ai/dsh-mcp-client'), 'patch must insert @deepseek-ai/dsh-mcp-client')
          check(/serverName:\s*mathematica\b/.test(text), 'serverName must be mathematica')
          check(/transport:\s*stdio\b/.test(text), 'transport must be stdio')
          check(/toolCallTimeoutMs:\s*180000\b/.test(text), 'toolCallTimeoutMs must be 180000')
          check(/failOnStartupError:\s*false\b/.test(text), 'failOnStartupError must be false')
          check(/command:\s*!!js\s+process\.env\.MATHEMATICA_MCP_NODE\s*\|\|\s*process\.execPath/.test(text), 'command must be process.execPath with a MATHEMATICA_MCP_NODE override')
          check(text.includes('ELECTRON_RUN_AS_NODE'), 'env must set ELECTRON_RUN_AS_NODE')
          check(text.includes('ctx.baseUrl'), 'path resolution must use ctx.baseUrl')
          check((text.match(/^\s+- !!js/mg) ?? []).length === 1, 'config.args must have exactly one !!js entry')
          if (failures.length) { for (const failure of failures) console.error('FAIL: ' + failure); process.exit(1) }
          console.log('bundle patch structure and guardrails OK')
          EOF

      - name: Verify the vendored notebook kernel bridge is in sync
        run: node notebook/scripts/sync-kernel.mjs --check

      - name: Validate notebook package, locales and icon
        run: |
          node - <<'EOF'
          const { readFileSync, existsSync, statSync } = require('node:fs')
          const failures = []
          const check = (ok, message) => { if (!ok) failures.push(message) }
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))

          // Package identity and manifest fields (must match the future market entry name).
          const notebook = readJson('notebook/package.json')
          check(notebook.name === 'dsh-mathematica-notebook', 'notebook package name must be dsh-mathematica-notebook')
          check(notebook.version === '0.1.0', 'notebook package version must be 0.1.0')
          check(notebook.type === 'module', 'notebook package must be ESM (type: module)')
          check(Object.keys(notebook.dependencies ?? {}).length === 0, 'notebook package must have zero runtime dependencies')
          check(notebook.dsh?.bundle?.patch === './cordis.patch.yml', 'notebook must declare dsh.bundle.patch = ./cordis.patch.yml')
          check(notebook.dsh?.client?.platform === 'web', 'notebook dsh.client.platform must be web')
          check(notebook.dsh?.client?.immediately === true, 'notebook dsh.client.immediately must be true')
          const inject = notebook.dsh?.client?.inject ?? []
          for (const dep of ['@deepseek-ai/dsh-client-connection', '@deepseek-ai/dsh-client-ui-sidebar-right', '@deepseek-ai/dsh-client-locale', '@deepseek-ai/dsh-client-ui-session']) {
            check(inject.includes(dep), `notebook dsh.client.inject must include ${dep}`)
          }
          check(notebook.exports?.['.'] === './index.js', 'notebook must export "." = ./index.js')
          check(notebook.exports?.['./client'] === './client.js', 'notebook must export "./client" = ./client.js')
          check(notebook.exports?.['./locale/*.json'] === './locale/*.json', 'notebook must export ./locale/*.json')
          check(notebook.exports?.['./icon'] === './icon.svg', 'notebook must export ./icon')

          // Files declared in the manifest and mandated by CONTRACT.md §8.
          for (const file of ['index.js', 'client.js', 'cordis.patch.yml', 'icon.svg', 'README.md', 'CONTRACT.md', 'locale/en.json', 'locale/zh.json', 'kernel/kernel.js', 'kernel/detect.js', 'scripts/sync-kernel.mjs']) {
            check(existsSync(`notebook/${file}`), `notebook/${file} is missing`)
          }
          for (const file of ['lib/rpc.js', 'lib/paths.js', 'lib/kernel-manager.js', 'lib/nb-codec.js', 'lib/store.js', 'lib/tools.js', 'lib/launcher.js']) {
            check(existsSync(`notebook/${file}`), `notebook/${file} is missing (CONTRACT.md §8 module map)`)
          }

          // Display metadata must be complete in every locale.
          for (const locale of ['en', 'zh']) {
            const text = readJson(`notebook/locale/${locale}.json`)
            check(typeof text.meta?.title === 'string' && text.meta.title.length > 0, `notebook/locale/${locale}.json meta.title missing`)
            check(typeof text.meta?.description === 'string' && text.meta.description.length > 0, `notebook/locale/${locale}.json meta.description missing`)
          }
          const iconSize = existsSync('notebook/icon.svg') ? statSync('notebook/icon.svg').size : 0
          check(iconSize > 100 && iconSize <= 256 * 1024, 'notebook/icon.svg must exist and be at most 256 KiB')
          check(existsSync('notebook/icon.svg') && readFileSync('notebook/icon.svg', 'utf8').includes('<svg'), 'notebook/icon.svg must be SVG')

          if (failures.length) { for (const failure of failures) console.error('FAIL: ' + failure); process.exit(1) }
          console.log('notebook package manifest, module map, locales and icon OK')
          EOF

      - name: Validate notebook bundle patch guardrails
        run: |
          node - <<'EOF'
          const { readFileSync } = require('node:fs')
          const text = readFileSync('notebook/cordis.patch.yml', 'utf8')
          const failures = []
          const check = (ok, message) => { if (!ok) failures.push(message) }
          check(/^- insert:/m.test(text), 'notebook patch must contain a top-level insert list')
          check(/^\s+- id: dsh-mathematica-notebook$/m.test(text), 'notebook patch row id must be dsh-mathematica-notebook')
          check(/^\s+name: '?(?:dsh-mathematica-notebook|\.\/index\.js)'?$/m.test(text), 'notebook patch row name must be the package name (preferred) or ./index.js (fallback)')
          check(/^\s+config: \{\}$/m.test(text), 'notebook patch row must keep config: {} (no schema-failing config)')
          if (failures.length) { for (const failure of failures) console.error('FAIL: ' + failure); process.exit(1) }
          console.log('notebook bundle patch guardrails OK')
          EOF

      - name: Load the notebook Host half (syntax and relative imports)
        # The Host half must be importable without a DSH process: modules attach no
        # side effects at import time (CONTRACT.md §8), so this catches syntax and
        # relative-import defects the unit tests may not touch.
        run: node --input-type=module -e "await import('./notebook/index.js')"

      - name: Verify workflow source copies are consistent
        run: |
          node - <<'EOF'
          const { readFileSync } = require('node:fs')
          const bodyOf = (path) => {
            const text = readFileSync(path, 'utf8').replace(/\r\n/g, '\n')
            const index = text.indexOf('name: CI')
            if (index < 0) throw new Error(`${path}: missing "name: CI"`)
            return text.slice(index).trim()
          }
          // The publication credential cannot push .github/workflows/**, so the
          // runnable workflow is also shipped as docs/ci-workflow.yml; the two
          // must stay identical from `name: CI` onward.
          if (bodyOf('.github/workflows/ci.yml') !== bodyOf('docs/ci-workflow.yml')) {
            console.error('docs/ci-workflow.yml must mirror .github/workflows/ci.yml')
            process.exit(1)
          }
          console.log('workflow copies are consistent')
          EOF
